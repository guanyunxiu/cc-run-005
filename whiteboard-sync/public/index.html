<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>直播白板 · 低延迟同步</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 加入房间界面 -->
  <div id="join-screen">
    <div class="join-card">
      <h1>🖊️ 直播白板</h1>
      <p class="subtitle">低延迟实时同步白板</p>
      <input id="room-input" type="text" placeholder="输入房间号，如 room-1" maxlength="32" autocomplete="off" />
      <button id="join-btn">加入房间</button>
      <p class="hint">多人输入相同房间号即可共享白板</p>
    </div>
  </div>

  <!-- 白板界面 -->
  <div id="board-screen" class="hidden">
    <header id="toolbar">
      <div class="toolbar-left">
        <span class="logo">🖊️ 白板</span>
        <span id="room-label"></span>
      </div>

      <div class="toolbar-center">
        <div id="color-palette">
          <button class="color-btn active" data-color="#1a1a1a" style="background:#1a1a1a"></button>
          <button class="color-btn" data-color="#e03131" style="background:#e03131"></button>
          <button class="color-btn" data-color="#1971c2" style="background:#1971c2"></button>
          <button class="color-btn" data-color="#2f9e44" style="background:#2f9e44"></button>
          <button class="color-btn" data-color="#f08c00" style="background:#f08c00"></button>
          <button class="color-btn" data-color="#9c36b5" style="background:#9c36b5"></button>
        </div>
        <label class="width-label">
          线宽
          <input id="width-slider" type="range" min="1" max="24" value="4" />
          <span id="width-value">4</span>
        </label>
        <button id="undo-btn" title="撤销自己最后一笔（CRDT 墓碑删除）">↩ 撤销</button>
      </div>

      <div class="toolbar-right">
        <span id="presence">在线 1 人</span>
        <span id="status" class="status status-offline">
          <span class="status-dot"></span><span id="status-text">未连接</span>
        </span>
      </div>
    </header>

    <div id="canvas-container">
      <canvas id="board"></canvas>

      <!-- CRDT 调试面板：VV / pending / 合并统计 / 墓碑 -->
      <div id="debug-panel">
        <div id="debug-header">
          <span>CRDT 调试</span>
          <button id="dbg-toggle" title="折叠/展开">▾</button>
        </div>
        <div id="dbg-body">
          <div class="dbg-row"><span>clientId</span><b id="dbg-client"></b></div>
          <div class="dbg-row"><span>向量时钟 VV</span><b id="dbg-vv"></b></div>
          <div class="dbg-row"><span>可见笔画</span><b id="dbg-strokes">0</b></div>
          <div class="dbg-row"><span>pending 缓冲</span><b id="dbg-pending">0</b></div>
          <div class="dbg-row"><span>合并次数</span><b id="dbg-merged">0</b></div>
          <div class="dbg-row"><span>墓碑数量</span><b id="dbg-tomb">0</b></div>
          <div class="dbg-row"><span>本地 outbox</span><b id="dbg-outbox">0</b></div>
        </div>
      </div>
    </div>
  </div>

  <script src="crdt.js"></script>
  <script src="app.js"></script>
</body>
</html>
